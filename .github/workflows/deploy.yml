name: Deploy Obfuscated Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      # 🟢 2. تشفير ملفات JS داخل dist/assets
      - name: Obfuscate JS files
        run: |
          find dist/assets -type f -name "*.js" -exec javascript-obfuscator {} --output {} \
            --compact true \
            --self-defending true \
            --string-array true \
            --string-array-rotate true \
            --string-array-shuffle true \
            --string-array-threshold 0.75 \;

      # 🟢 3. نقل الملفات الكبيرة إلى مجلد منفصل
      - name: Move large data files
        run: |
          mkdir -p dist/data-large
          mv dist/movies_data.json dist/data-large/ 2>/dev/null || true
          mv dist/ramadan_2026_results.json dist/data-large/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
